# Deploy di CasaOS (via SSH):
#   cp .env.example .env   # lalu edit isinya
#   docker compose up -d --build
name: casa-files
services:
  casa-files:
    build: .
    image: casa-files-server:latest
    container_name: casa-files
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?isi APP_PASSWORD di file .env}
      TOKEN_SECRET: ${TOKEN_SECRET:?isi TOKEN_SECRET di file .env}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-720}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      # Folder di server yang bisa diakses lewat app (disk 1.5TB kamu)
      - ${STORAGE_PATH:?isi STORAGE_PATH di file .env}:/data
x-casaos:
  architectures: [amd64, arm64]
  main: casa-files
  title:
    en_us: Casa Files
  category: Utilities
  port_map: "${PORT:-8088}"
